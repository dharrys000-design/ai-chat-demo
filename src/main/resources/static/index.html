<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Learning Chat</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>AI Learning Chat</h1>
      <p class="subtle">Chat with the Spring Boot app using normal or streaming responses.</p>

      <div class="grid">
        <div>
          <label for="message">Message</label>
          <textarea id="message" placeholder="Ask something like: Explain REST in simple terms"></textarea>
        </div>
        <div>
          <label for="conversationId">Conversation ID</label>
          <input id="conversationId" placeholder="Optional" />
          <div class="actions" style="margin-top: 10px;">
            <button class="secondary" id="newConversation" type="button">New ID</button>
          </div>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="promptTemplate">Prompt template</label>
          <select id="promptTemplate">
            <option value="default">default</option>
            <option value="coding">coding</option>
            <option value="debugging">debugging</option>
            <option value="explanation">explanation</option>
            <option value="creative">creative</option>
          </select>
        </div>

        <div>
          <label for="endpointMode">Mode</label>
          <select id="endpointMode">
            <option value="message">Normal response</option>
            <option value="stream">Streaming (SSE)</option>
          </select>
        </div>

        <div class="inline">
          <input type="checkbox" id="autoGenerateId" checked />
          <label for="autoGenerateId" style="margin:0;">Auto-generate conversation ID</label>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="sendBtn" type="button">Send</button>
        <button class="ghost" id="clearBtn" type="button">Clear output</button>
      </div>

      <div id="status" class="status">Ready.</div>
      <div id="output" class="output"></div>

      <div class="footer">
        Tip: keep the same <code>conversationId</code> to continue a conversation thread.
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
