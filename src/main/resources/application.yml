server:
  port: 8082

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-3.5-turbo}
          temperature: 0.7

ai:
  prompts:
    system: "You are a helpful AI assistant for learning purposes."
    max-history: 10

logging:
  level:
    com.learning.ai: DEBUG
    org.springframework.ai: INFO

---
spring:
  config:
    activate:
      on-profile: local-ollama
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:ollama}
      base-url: ${OPENAI_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OPENAI_MODEL:llama3.2}
          temperature: 0.7